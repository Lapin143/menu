<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Меню на 30 дней</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Меню на 30 дней</h1>
    <nav>
      <button data-tab="today" class="active">Сегодня</button>
      <button data-tab="dishes">Блюда</button>
      <button data-tab="shopping">Покупки</button>
      <button data-tab="settings">Настройки</button>
    </nav>
  </header>

  <main>
    <section id="tab-today" class="tab active"></section>
    <section id="tab-dishes" class="tab"></section>
    <section id="tab-shopping" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modal-title"></strong>
        <button id="modal-close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
